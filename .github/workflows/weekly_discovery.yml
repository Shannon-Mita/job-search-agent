name: Weekly Company Discovery

on:
  workflow_dispatch:  # Manual only — discovery sources unreliable, re-enable when fixed

permissions:
  contents: write

jobs:
  discover-companies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml python-dotenv playwright
          playwright install chromium --with-deps

      - name: Create .env from secrets
        run: |
          echo "GMAIL_ADDRESS=${{ secrets.GMAIL_ADDRESS }}" >> .env
          echo "GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}" >> .env
          echo "NOTIFY_EMAIL=${{ secrets.NOTIFY_EMAIL }}" >> .env
          echo "SERPER_API_KEY=${{ secrets.SERPER_API_KEY }}" >> .env
          echo "JOOBLE_API_KEY=${{ secrets.JOOBLE_API_KEY }}" >> .env
          echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" >> .env

      - name: Initialise database
        run: python skills/profile/init_db.py

      - name: Check and fix dead career page URLs
        run: python skills/watch/url_checker.py --status failed --fix

      - name: Search Jooble market-wide jobs (weekly — limited request budget)
        run: python skills/search/jooble_search.py

      - name: Score jobs
        run: python skills/score/scorer.py --rescore-all

      - name: Send job digest email
        run: python skills/notify/email_digest.py

      - name: Run automated feedback learning
        run: python skills/analysis/feedback_learning.py

      - name: Discover new companies
        run: python skills/signals/company_discovery.py

      - name: Send company digest email
        run: python skills/notify/company_digest.py

      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen_jobs.json skills/search/query_terms.json data/companies.csv
          git commit -m "Weekly update: seen jobs, feedback learning [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main
          git push
