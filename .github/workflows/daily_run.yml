name: Daily Job Search

on:
  schedule:
    # 7am UK time (UTC in winter, BST = UTC+1 in summer)
    - cron: '0 7 * * *'
  workflow_dispatch:  # allows manual trigger from GitHub UI

jobs:
  run-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml pandas openpyxl \
                      python-dotenv schedule pytest playwright
          playwright install chromium --with-deps

      - name: Create .env from secrets
        run: |
          echo "GMAIL_ADDRESS=${{ secrets.GMAIL_ADDRESS }}" >> .env
          echo "GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}" >> .env
          echo "NOTIFY_EMAIL=${{ secrets.NOTIFY_EMAIL }}" >> .env
          echo "SERPER_API_KEY=${{ secrets.SERPER_API_KEY }}" >> .env
          echo "ADZUNA_APP_ID=${{ secrets.ADZUNA_APP_ID }}" >> .env
          echo "ADZUNA_APP_KEY=${{ secrets.ADZUNA_APP_KEY }}" >> .env
          echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" >> .env

      - name: Initialise database
        run: python skills/profile/init_db.py

      - name: Scrape watchlist career pages
        run: python skills/watch/career_page_scraper.py

      - name: Search climate boards via Serper
        run: python skills/search/serper_search.py

      - name: Search Adzuna market-wide jobs
        run: python skills/search/adzuna_search.py

      # - name: Search bridge income opportunities
      #   run: python skills/search/bridge_search.py

      - name: Score all jobs
        run: python skills/score/scorer.py --rescore-all

      - name: Run automated feedback learning
        run: python skills/analysis/feedback_learning.py

      - name: Export dashboard data
        run: |
          python3 -c "
          import sys, json
          from datetime import datetime
          sys.path.insert(0, 'skills/profile')
          from db import get_conn
          conn = get_conn()
          rows = conn.execute('''
              SELECT title, company_name as company, location, url, score, category
              FROM jobs WHERE notified = 1 ORDER BY score DESC
          ''').fetchall()
          output = {
              'generated_at': datetime.now().strftime('%d %b %Y, %H:%M UTC'),
              'jobs': [dict(r) for r in rows]
          }
          with open('docs/data.json', 'w') as f:
              json.dump(output, f, indent=2)
          print(f'Exported {len(rows)} jobs to docs/data.json')
          "

      - name: Send email digest
        run: python skills/notify/email_digest.py

      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen_jobs.json docs/data.json skills/search/query_terms.json data/companies.csv
          git commit -m "Daily update: seen jobs, dashboard data, feedback learning [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main
          git push
