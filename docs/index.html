<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Job search dashboard</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; background: #F9FAFB; color: #111827; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 24px 16px 80px; }
  h1 { font-size: 20px; font-weight: 500; margin: 0 0 4px; }
  .sub { font-size: 13px; color: #6B7280; margin: 0 0 20px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab { padding: 6px 14px; border-radius: 20px; font-size: 13px; border: 0.5px solid #E5E7EB; background: #fff; cursor: pointer; }
  .tab.active { background: #111827; color: #fff; border-color: #111827; }
  .card { background: #fff; border: 0.5px solid #E5E7EB; border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
  .card.dismissed { opacity: 0.4; }
  .row-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .title { font-size: 14px; font-weight: 500; margin: 0 0 4px; }
  .title a { color: #111827; text-decoration: none; }
  .meta { font-size: 12px; color: #6B7280; }
  .badges { display: flex; gap: 6px; margin-top: 6px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 500; }
  .badge.climate { background: #E1F5EE; color: #0F6E56; }
  .badge.tech { background: #EEEDFE; color: #3C3489; }
  .badge.score { background: #F1EFE8; color: #444441; }
  .actions { display: flex; gap: 6px; flex-shrink: 0; }
  .actions button { width: 32px; height: 32px; border-radius: 8px; border: 0.5px solid #E5E7EB; background: #fff; cursor: pointer; font-size: 15px; }
  .actions button.yes.active { background: #E1F5EE; border-color: #0F6E56; }
  .actions button.no.active { background: #FCEBEB; border-color: #A32D2D; }
  .reason-picker { display: none; gap: 4px; margin-top: 8px; flex-wrap: wrap; }
  .reason-picker.show { display: flex; }
  .reason-btn { font-size: 11px; padding: 4px 10px; border-radius: 14px; border: 0.5px solid #E5E7EB; background: #fff; cursor: pointer; }
  .reason-btn.active { background: #111827; color: #fff; border-color: #111827; }
  .empty { text-align: center; padding: 60px 20px; color: #9CA3AF; font-size: 14px; }
  .stats { display: flex; gap: 10px; margin-bottom: 16px; }
  .stat { background: #fff; border-radius: 8px; padding: 10px 14px; flex: 1; border: 0.5px solid #E5E7EB; }
  .stat .n { font-size: 20px; font-weight: 500; }
  .stat .l { font-size: 11px; color: #6B7280; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Job search dashboard</h1>
  <p class="sub" id="subtitle">Loading...</p>

  <div class="stats">
    <div class="stat"><div class="n" id="statTotal">0</div><div class="l">roles</div></div>
    <div class="stat"><div class="n" id="statRelevant">0</div><div class="l">marked relevant</div></div>
    <div class="stat"><div class="n" id="statDismissed">0</div><div class="l">dismissed</div></div>
  </div>

  <div class="tabs">
    <div class="tab active" data-filter="all">All</div>
    <div class="tab" data-filter="climate">Climate</div>
    <div class="tab" data-filter="tech">Tech / AI</div>
    <div class="tab" data-filter="unreviewed">Unreviewed</div>
  </div>

  <div id="list"></div>
</div>

<script>
let jobs = [];
let feedback = JSON.parse(localStorage.getItem('job-feedback') || '{}');
let currentFilter = 'all';

function fingerprint(job) {
  return (job.company + '|' + job.title).toLowerCase().trim();
}

async function loadJobs() {
  try {
    const res = await fetch('./data.json?t=' + Date.now());
    const data = await res.json();
    jobs = data.jobs || [];
    document.getElementById('subtitle').textContent =
      jobs.length + ' roles · updated ' + (data.generated_at || 'unknown');
  } catch (e) {
    document.getElementById('subtitle').textContent = 'Could not load jobs — check back later';
  }
  render();
}

function render() {
  const list = document.getElementById('list');
  let filtered = jobs;
  if (currentFilter === 'climate') filtered = jobs.filter(j => j.category === 'climate');
  if (currentFilter === 'tech') filtered = jobs.filter(j => j.category === 'tech');
  if (currentFilter === 'unreviewed') filtered = jobs.filter(j => !feedback[fingerprint(j)]);
  filtered.sort((a, b) => (b.score || 0) - (a.score || 0));

  list.innerHTML = filtered.length === 0
    ? '<div class="empty">No roles here yet.</div>'
    : filtered.map(job => {
      const fp = fingerprint(job);
      const fb = feedback[fp];
      return `<div class="card ${fb === 'no' ? 'dismissed' : ''}">
        <div class="row-top">
          <div>
            <p class="title"><a href="${job.url || '#'}" target="_blank">${job.title}</a></p>
            <div class="meta">${job.company || 'Unknown'} · ${job.location || 'No location'}</div>
            <div class="badges">
              <span class="badge ${job.category || 'climate'}">${job.category || 'climate'}</span>
              <span class="badge score">${job.score || 0}/100</span>
            </div>
          </div>
          <div class="actions">
            <button class="yes ${fb === 'yes' ? 'active' : ''}" data-fp="${fp}" data-val="yes">&#10003;</button>
            <button class="no ${fb === 'no' ? 'active' : ''}" data-fp="${fp}" data-val="no">&#10005;</button>
          </div>
        </div>
        <div class="reason-picker" id="reason-${fp}">
          ${['Role', 'Salary', 'Company', 'Location'].map(r =>
            `<button class="reason-btn" data-fp="${fp}" data-reason="${r}">${r}</button>`
          ).join('')}
        </div>
      </div>`;
    }).join('');

  document.getElementById('statTotal').textContent = jobs.length;
  document.getElementById('statRelevant').textContent = Object.values(feedback).filter(v => v === 'yes').length;
  document.getElementById('statDismissed').textContent = Object.values(feedback).filter(v => v === 'no').length;
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentFilter = tab.dataset.filter;
    render();
  });
});

const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbzFrTou0iJRghRxFf54BxmtqYs3d1E8LyBhs986TLmWirIQg3ZRMK06LioAGV8Ys0l4ug/exec";
const WEBHOOK_SECRET = "MitaJobs9920x7k2";

function postFeedback(job, val, reason) {
  fetch(WEBHOOK_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify({
      secret: WEBHOOK_SECRET,
      title: job.title || "",
      company: job.company || "",
      category: job.category || "",
      feedback: val,
      reason: reason
    })
  }).catch(() => {});
}

let pendingFeedback = {};

document.getElementById('list').addEventListener('click', (e) => {
  const actionBtn = e.target.closest('button[data-fp][data-val]');
  const reasonBtn = e.target.closest('button[data-fp][data-reason]');

  if (actionBtn) {
    const fp = actionBtn.dataset.fp, val = actionBtn.dataset.val;
    pendingFeedback[fp] = val;
    document.querySelectorAll('.reason-picker').forEach(el => el.classList.remove('show'));
    document.getElementById('reason-' + fp).classList.add('show');
    return;
  }

  if (reasonBtn) {
    const fp = reasonBtn.dataset.fp, reason = reasonBtn.dataset.reason;
    const val = pendingFeedback[fp];
    const job = jobs.find(j => fingerprint(j) === fp);

    feedback[fp] = val;
    localStorage.setItem('job-feedback', JSON.stringify(feedback));

    if (job) postFeedback(job, val, reason);
    document.getElementById('reason-' + fp).classList.remove('show');
    render();
  }
});

loadJobs();
</script>
</body>
</html>
